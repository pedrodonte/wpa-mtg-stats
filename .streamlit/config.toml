# Configuración de Streamlit para MTG Telemetry Analyzer
[server]
# Habilita el servido de archivos estáticos desde ./static (iconos + manifest PWA).
enableStaticServing = true
enableXsrfProtection = true

[theme]
# Paleta Matrix: fondo casi negro + verde neón
base = "dark"
primaryColor = "#00FF41"           # Verde Matrix — acento principal
backgroundColor = "#0A0F0A"        # Negro con tinte verde
secondaryBackgroundColor = "#0F1A0F"  # Verde muy oscuro (paneles)
textColor = "#39FF14"              # Verde neón (texto)
font = "monospace"

[browser]
gatherUsageStats = false
