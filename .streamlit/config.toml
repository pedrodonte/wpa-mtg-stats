# Configuración de Streamlit para MTG Telemetry Analyzer
[server]
# Habilita el servido de archivos estáticos desde ./static (iconos + manifest PWA).
enableStaticServing = true
enableXsrfProtection = true

[theme]
# Paleta tricolor: Blanco (W) + Azul (U) + Rojo (R)
base = "dark"
primaryColor = "#E8493B"          # Rojo (R) — acento principal
backgroundColor = "#0B1220"        # Azul noche profundo (U)
secondaryBackgroundColor = "#14213D"  # Azul acero (U)
textColor = "#F5F3E7"              # Blanco marfil (W)

[browser]
gatherUsageStats = false
